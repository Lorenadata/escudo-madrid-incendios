name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: escudo
          POSTGRES_PASSWORD: escudo_dev_only
          POSTGRES_DB: escudo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U escudo" --health-interval 5s --health-timeout 5s --health-retries 20
          --shm-size=512mb
    env:
      DATABASE_URL_TEST: postgresql+psycopg://escudo:escudo_dev_only@localhost:5433/escudo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check apps/api pipelines services tests
      - name: Descarga real de datos CAM (T01, red)
        run: python -m escudo_pipelines.fetch
      - run: python -m escudo_pipelines.cam_transform
      - name: Tests (unit + pipelines + integración PostGIS)
        run: pytest -q -m "not network"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
