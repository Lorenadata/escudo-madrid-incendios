[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "escudo-madrid"
version = "0.1.0"
description = "ESCUDO MADRID — plataforma de planificación preventiva de incendios forestales (DATAMAD 2026)"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "httpx>=0.27",
  "shapely>=2.0",
  "numpy>=2.0",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "ortools>=9.10",
  "reportlab>=4.2",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["apps/api", "pipelines", "services/optimizer", "services/reporting"]
include = ["escudo_*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/tests"]
markers = [
  "db: requiere PostGIS (DATABASE_URL_TEST)",
  "network: requiere acceso a Internet (fuentes oficiales)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["escudo_api", "escudo_pipelines", "escudo_optimizer", "escudo_reporting"]
